<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Liga de Surquillo - Control</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #080c08;
            --card-bg: #111611;
            --primary-green: #2ecc71;
            --text-light: #e0e0e0;
            --danger: #e74c3c;
            --warning: #f1c40f;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-light); 
            margin: 0; 
            padding: 15px;
            overscroll-behavior: none;
        }
        
        header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .logo-placeholder { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--primary-green); background: #1a1f1a; }
        header h1 { margin: 0; font-size: 1.2rem; color: white; text-transform: uppercase; }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: #1a1f1a; padding: 5px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: transparent; color: #666; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: #242b24; color: var(--primary-green); border: 1px solid var(--primary-green); }

        .view { display: none; }
        .view.active { display: block; }

        /* Mesas */
        .grid-mesas { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .card-mesa { background: var(--card-bg); border-radius: 15px; padding: 20px; border: 1px solid #1a221a; }
        .timer-big { font-size: 3rem; font-family: monospace; text-align: center; margin: 15px 0; color: #1a221a; }
        .timer-big.active { color: var(--primary-green); }
        .timer-big.paused { color: var(--warning); opacity: 0.5; }

        .controles { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 15px; border-radius: 10px; font-weight: bold; border: 1px solid; background: transparent; cursor: pointer; }
        .btn-start { border-color: var(--primary-green); color: var(--primary-green); }
        .btn-pause { border-color: var(--warning); color: var(--warning); }
        .btn-stop { border-color: var(--danger); color: var(--danger); }

        /* Reporte */
        .resumen-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .resumen-card { background: #151b15; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #1f261f; }
        .resumen-card h4 { margin: 0; font-size: 0.7rem; color: #555; }
        .resumen-card div { font-size: 1rem; color: var(--primary-green); font-weight: bold; margin-top: 5px; }

        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 15px; }
        th { text-align: left; color: #444; padding: 10px; border-bottom: 1px solid #222; }
        td { padding: 12px 10px; border-bottom: 1px solid #161a16; }
        .total-row { background: #1a231a; font-weight: bold; color: var(--primary-green); }

        /* Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: 20px; border: 1px solid var(--primary-green); width: 80%; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo-placeholder"></div>
        <div>
            <small style="color:var(--primary-green); font-weight:bold;">SISTEMA DE CONTROL</small>
            <h1>LA LIGA DE SURQUILLO</h1>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('mesas', this)">🎱 MESAS</button>
        <button class="tab-btn" onclick="switchTab('reporte', this)">📊 REPORTE</button>
    </div>

    <div id="view-mesas" class="view active">
        <div class="grid-mesas" id="container-mesas"></div>
    </div>

    <div id="view-reporte" class="view">
        <div class="resumen-grid" id="resumen-mesas"></div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr class="total-row" id="total-row"></tr>
                    <tr><th>MESA</th><th>INICIO</th><th>FIN</th><th>TIEMPO</th><th>TOTAL</th></tr>
                </thead>
                <tbody id="historial-body"></tbody>
            </table>
        </div>
        <button class="btn btn-start" style="width:100%; margin-top:20px;" onclick="exportarExcel()">📥 EXCEL</button>
        <button class="btn btn-stop" style="width:100%; margin-top:10px;" onclick="limpiarTodo()">🗑️ LIMPIAR TURNO</button>
    </div>

    <div id="modal-cobro" class="modal">
        <div class="modal-content">
            <h2 id="m-title">Mesa</h2>
            <p>Tiempo: <strong id="m-tiempo">00:00:00</strong></p>
            <h1 id="m-monto" style="color:var(--primary-green)">S/ 0.00</h1>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn btn-stop" onclick="cerrarModal()">CANCELAR</button>
                <button class="btn btn-start" onclick="confirmarCobro()">CONFIRMAR</button>
            </div>
        </div>
    </div>

    <script>
        const tarifas = { 1:12, 2:15, 3:12, 4:12, 5:12, 6:12 };
        let historial = JSON.parse(localStorage.getItem('liga_hist')) || [];
        let estados = {};
        let mesaEnCobro = null;

        function init() {
            const grid = document.getElementById('container-mesas');
            grid.innerHTML = ""; // Limpia por si acaso
            for(let i=1; i<=6; i++) {
                estados[i] = { activo: false, pausado: false, inicio: null, acumulado: 0, intervalo: null };
                grid.innerHTML += `
                    <div class="card-mesa">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <strong style="font-size:1.1rem">MESA ${i}</strong>
                            <small id="st-${i}" style="background:#1a1f1a; padding:4px 8px; border-radius:5px; font-size:0.6rem; color:#555">● LIBRE</small>
                        </div>
                        <div class="timer-big" id="tm-${i}">00:00:00</div>
                        <div id="ctrl-${i}">
                            <button class="btn btn-start" style="width:100%" onclick="iniciar(${i})">▶ INICIAR TURNO</button>
                        </div>
                    </div>`;
            }
        }

        function iniciar(id) {
            const m = estados[id];
            m.activo = true; m.pausado = false; m.inicio = new Date();
            m.intervalo = setInterval(() => {
                if(!m.pausado) {
                    const diff = m.acumulado + (new Date() - m.inicio);
                    document.getElementById(`tm-${id}`).innerText = new Date(diff).toISOString().substr(11, 8);
                }
            }, 1000);
            document.getElementById(`tm-${id}`).className = "timer-big active";
            document.getElementById(`ctrl-${id}`).innerHTML = `
                <div class="controles">
                    <button id="bp-${id}" class="btn btn-pause" onclick="pausar(${id})">II Pausar</button>
                    <button class="btn btn-stop" onclick="prepararCobro(${id})">S/ Cobrar</button>
                </div>`;
        }

        function pausar(id) {
            const m = estados[id];
            if(!m.pausado) {
                m.pausado = true; m.acumulado += (new Date() - m.inicio);
                document.getElementById(`tm-${id}`).classList.add('paused');
                document.getElementById(`bp-${id}`).innerText = "▶ Continuar";
            } else {
                m.pausado = false; m.inicio = new Date();
                document.getElementById(`tm-${id}`).classList.remove('paused');
                document.getElementById(`bp-${id}`).innerText = "II Pausar";
            }
        }

        function prepararCobro(id) {
            mesaEnCobro = id;
            const m = estados[id];
            let ms = m.acumulado + (m.pausado ? 0 : (new Date() - m.inicio));
            document.getElementById('m-title').innerText = `MESA ${id}`;
            document.getElementById('m-tiempo').innerText = new Date(ms).toISOString().substr(11, 8);
            document.getElementById('m-monto').innerText = `S/ ${(ms/3600000 * tarifas[id]).toFixed(2)}`;
            document.getElementById('modal-cobro').style.display = 'flex';
        }

        function confirmarCobro() {
            const id = mesaEnCobro;
            const m = estados[id];
            let ms = m.acumulado + (m.pausado ? 0 : (new Date() - m.inicio));
            historial.push({ 
                Mesa: id, 
                In: m.inicio.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
                Out: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
                Dur: document.getElementById('m-tiempo').innerText,
                Total: parseFloat((ms/3600000 * tarifas[id]).toFixed(2))
            });
            localStorage.setItem('liga_hist', JSON.stringify(historial));
            clearInterval(m.intervalo);
            estados[id] = { activo: false, pausado: false, inicio: null, acumulado: 0, intervalo: null };
            document.getElementById(`tm-${id}`).innerText = "00:00:00";
            document.getElementById(`tm-${id}`).className = "timer-big";
            document.getElementById(`ctrl-${id}`).innerHTML = `<button class="btn btn-start" style="width:100%" onclick="iniciar(${id})">▶ Iniciar</button>`;
            cerrarModal();
        }

        function cerrarModal() { document.getElementById('modal-cobro').style.display = 'none'; }

        function switchTab(t, b) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('view-'+t).classList.add('active');
            b.classList.add('active');
            if(t === 'reporte') renderReporte();
        }

        function renderReporte() {
            const res = document.getElementById('resumen-mesas');
            const body = document.getElementById('historial-body');
            res.innerHTML = ""; body.innerHTML = "";
            let totalT = 0;
            for(let i=1; i<=6; i++) {
                const suma = historial.filter(h => h.Mesa == i).reduce((a, c) => a + c.Total, 0);
                totalT += suma;
                res.innerHTML += `<div class="resumen-card"><h4>MESA ${i}</h4><div>S/ ${suma.toFixed(2)}</div></div>`;
            }
            document.getElementById('total-row').innerHTML = `<td colspan="4">TOTAL TURNO</td><td>S/ ${totalT.toFixed(2)}</td>`;
            [...historial].reverse().forEach(h => {
                body.innerHTML += `<tr><td>${h.Mesa}</td><td>${h.In}</td><td>${h.Out}</td><td>${h.Dur}</td><td>S/ ${h.Total.toFixed(2)}</td></tr>`;
            });
        }

        function limpiarTodo() { if(confirm("¿Borrar turno?")) { historial = []; localStorage.removeItem('liga_hist'); renderReporte(); } }

        function exportarExcel() {
            const ws = XLSX.utils.json_to_sheet(historial);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Reporte");
            XLSX.writeFile(wb, `Liga_${new Date().toLocaleDateString()}.xlsx`);
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
        }

        init();
    </script>
</body>
</html>
